<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/estrellita-blanco.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123324" />
    <meta
      name="description"
      content="Mintur: plataforma de gestión turística del Ministerio de Turismo de Formosa. Administración de usuarios, alojamientos, prestadores y estadísticas del sector."
    />
    <meta name="robots" content="noindex" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mintur" />
    <meta property="og:title" content="Mintur · Plataforma de Gestión Turística" />
    <meta
      property="og:description"
      content="Administración de usuarios, alojamientos, prestadores y estadísticas del sector turístico."
    />
    <meta property="og:locale" content="es_AR" />
    <title>Mintur · Plataforma de Gestión Turística</title>
    <script>
      // Aplica el tema guardado (o el del sistema) antes del primer pintado,
      // para evitar el flash de tema claro en una app oscura.
      ;(function () {
        try {
          var stored = localStorage.getItem("mintur-theme")
          var theme =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system"
          var dark =
            theme === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
              : theme === "dark"

          var root = document.documentElement
          root.classList.toggle("dark", dark)
          root.style.colorScheme = dark ? "dark" : "light"
        } catch (error) {
          // Sin storage disponible se respeta la preferencia del navegador.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
